name: Publish reliability dashboard

on:
  # Rebuilds right after each collection run finishes, so the published page
  # always reflects the latest data with no separate timer to keep in sync.
  workflow_run:
    workflows: ["Collect LUMA outage snapshot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deploys must not overlap; queue rather than run concurrently.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Skip when triggered by a failed collection run (nothing new to show);
    # manual dispatch always proceeds.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard
        run: python -m src.dashboard

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
