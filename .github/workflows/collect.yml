name: Collect LUMA outage snapshot

on:
  schedule:
    # GitHub's native schedule trigger is best-effort: measured on this repo
    # while set to */10, it actually fired roughly every 100 minutes instead
    # of every 10 - GitHub silently delays/drops sub-15-minute schedules
    # under load, especially on public/low-traffic repos. The real
    # 10-minute clock is a Supabase pg_cron job (see db/schema.sql) that
    # calls this workflow's workflow_dispatch API directly, since
    # API-triggered runs start within seconds and skip GitHub's scheduling
    # queue entirely.
    #
    # This trigger is kept only as a fallback in case the pg_cron job (or
    # its GitHub token in Supabase Vault) ever breaks - source_timestamp is
    # unique on outage_snapshots, so an occasional double-trigger with
    # pg_cron just no-ops. Set to 30 minutes rather than 10: a coarser
    # target has a better chance of actually firing (less queue
    # contention), and there's no real precision to preserve here since
    # GitHub never reliably honored the tighter interval anyway.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      # Lets the headless-browser fallback below be exercised on demand
      # (e.g. `gh workflow run collect.yml -f force_browserless_fallback=true`)
      # instead of waiting for a real WAF block. The pg_cron dispatch sends
      # no inputs, so scheduled runs are unaffected.
      force_browserless_fallback:
        description: Run the browserless fallback even if the direct scrape succeeds
        type: boolean
        default: false

# At most one collection run pending at a time. Without this, a GitHub
# Actions outage lets the Supabase pg_cron job's dispatches (or repeated
# manual runs) pile up as a backlog that all release at once when GitHub
# recovers; cancelled backlog runs don't send a notification email, only
# genuine failures do.
concurrency:
  group: collect-luma-outage-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Captures the real exit code as a step output (rather than just
      # success/failure) so the steps below can tell a WAF block (exit code 2,
      # worth retrying via the headless-browser fallback) apart from any other
      # error, such as a Supabase permission or schema problem, which
      # wouldn't be fixed by retrying and shouldn't trigger the fallback.
      - name: Scrape
        id: scrape
        continue-on-error: true
        run: |
          python -m src && exit_code=0 || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # The fallback runs on a WAF block (exit code 2), or when forced via the
      # workflow_dispatch input - but only on top of a successful direct
      # scrape, never a genuine (non-WAF) error, which it couldn't fix.
      - name: Decide whether to use the browserless fallback
        id: fallback
        run: |
          scrape_exit_code='${{ steps.scrape.outputs.exit_code }}'
          force_fallback='${{ inputs.force_browserless_fallback }}'
          if [ "$scrape_exit_code" = '2' ] || { [ "$force_fallback" = 'true' ] && [ "$scrape_exit_code" = '0' ]; }; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # The LUMA outage API sits behind an Incapsula WAF that occasionally
      # blocks direct requests even with browser-like headers. When that
      # happens, fall back to loading the real status page in a headless
      # browser and intercepting the same XHR response the page itself makes,
      # which passes the WAF like any other browser visit. This mirrors the
      # approach proven by https://github.com/jpadilla/tracking-luma-outages.
      - name: Run browserless
        if: steps.fallback.outputs.needed == 'true'
        run: |
          docker run -d \
            --name browserless \
            -p 3000:3000 \
            -e "MAX_CONCURRENT_SESSIONS=1" \
            -e "QUEUE_LENGTH=0" \
            browserless/chrome
          # Wait until browserless actually answers HTTP rather than sleeping
          # a fixed time, so the first capture isn't sent to a container
          # that's still starting up.
          for readiness_check in $(seq 1 30); do
            if curl --silent --output /dev/null http://localhost:3000/; then
              echo "browserless ready after ${readiness_check}s"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::browserless did not answer within 30s; trying the capture anyway."

      # The page-side logic lives in scripts/capture_region_snapshot.js; jq
      # wraps it as the {"code": ...} body browserless's /function endpoint
      # expects. Each attempt is checked right away, and the step stops at the
      # first one that yields real JSON without a captureError - so one slow
      # or flaky page load doesn't fail the whole run. Whatever the last
      # attempt produced is left for the Validate step below to judge.
      - name: Capture region snapshot via browserless
        if: steps.fallback.outputs.needed == 'true'
        run: |
          capture_max_attempts=3
          capture_retry_delay_seconds=10
          jq --raw-input --slurp '{code: .}' scripts/capture_region_snapshot.js > /tmp/browserless_request.json
          for capture_attempt in $(seq 1 "$capture_max_attempts"); do
            curl --silent --max-time 90 --request POST \
              --url http://localhost:3000/function \
              --header 'Content-Type: application/json' \
              --data @/tmp/browserless_request.json \
              --output /tmp/clients_without_service.json || true
            if jq --exit-status 'type == "object" and (has("captureError") | not)' /tmp/clients_without_service.json > /dev/null 2>&1; then
              echo "captured region snapshot on attempt $capture_attempt/$capture_max_attempts"
              cat /tmp/clients_without_service.json
              exit 0
            fi
            echo "::warning::browserless capture attempt $capture_attempt/$capture_max_attempts failed; response:"
            cat /tmp/clients_without_service.json 2>/dev/null || echo "(no response body)"
            echo
            if [ "$capture_attempt" -lt "$capture_max_attempts" ]; then
              sleep "$capture_retry_delay_seconds"
            fi
          done

      # Fails fast with a clear cause if every capture attempt above failed,
      # rather than letting it surface two steps later as a confusing Python
      # JSONDecodeError or KeyError. A failed capture is either plain error
      # text from browserless or the JSON diagnostics (captureError, pageUrl,
      # pageTitle, pageContentStart) from scripts/capture_region_snapshot.js -
      # a WAF challenge page shows up there as an Incapsula title/content.
      - name: Validate browserless capture
        if: steps.fallback.outputs.needed == 'true'
        run: |
          if ! jq empty /tmp/clients_without_service.json 2>/dev/null; then
            echo "::error::browserless did not return valid JSON - see the 'Capture region snapshot via browserless' step's output above for the actual response."
            exit 1
          fi
          if jq --exit-status 'has("captureError")' /tmp/clients_without_service.json > /dev/null 2>&1; then
            echo "::error::browserless capture failed: $(jq --raw-output '.captureError' /tmp/clients_without_service.json) (page title: $(jq --raw-output '.pageTitle' /tmp/clients_without_service.json)) - see the 'Capture region snapshot via browserless' step's output above for the full diagnostics."
            exit 1
          fi

      - name: Scrape using captured snapshot
        if: steps.fallback.outputs.needed == 'true'
        run: python -m src
        env:
          CLIENTS_WITHOUT_SERVICE_FILE: /tmp/clients_without_service.json

      # Only runs once a snapshot was actually written this run - i.e. the
      # direct scrape succeeded (exit code 0), or the WAF-blocked path (exit
      # code 2) recovered via the browserless fallback above. If the
      # fallback itself failed, that step's own failure already means this
      # one is skipped (its implicit success() check catches that), so no
      # extra condition is needed for that case.
      - name: Recompute reliability metrics
        if: steps.scrape.outputs.exit_code == '0' || steps.scrape.outputs.exit_code == '2'
        run: python -m src.metrics

      - name: Fail job on non-WAF scrape error
        if: steps.scrape.outputs.exit_code != '0' && steps.scrape.outputs.exit_code != '2'
        run: |
          echo "::error::Scrape failed for a reason other than a WAF block (see the Scrape step log above) - not retrying via the browserless fallback."
          exit 1

      - name: Stop browserless
        if: always()
        run: docker rm --force browserless || true
