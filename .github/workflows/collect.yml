name: Collect LUMA outage snapshot

on:
  schedule:
    # GitHub's native schedule trigger is best-effort: measured on this repo
    # while set to */10, it actually fired roughly every 100 minutes instead
    # of every 10 - GitHub silently delays/drops sub-15-minute schedules
    # under load, especially on public/low-traffic repos. The real
    # 10-minute clock is a Supabase pg_cron job (see db/schema.sql) that
    # calls this workflow's workflow_dispatch API directly, since
    # API-triggered runs start within seconds and skip GitHub's scheduling
    # queue entirely.
    #
    # This trigger is kept only as a fallback in case the pg_cron job (or
    # its GitHub token in Supabase Vault) ever breaks - source_timestamp is
    # unique on outage_snapshots, so an occasional double-trigger with
    # pg_cron just no-ops. Set to 30 minutes rather than 10: a coarser
    # target has a better chance of actually firing (less queue
    # contention), and there's no real precision to preserve here since
    # GitHub never reliably honored the tighter interval anyway.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Captures the real exit code as a step output (rather than just
      # success/failure) so the steps below can tell a WAF block (exit code 2,
      # worth retrying via the headless-browser fallback) apart from any other
      # error, such as a Supabase permission or schema problem, which
      # wouldn't be fixed by retrying and shouldn't trigger the fallback.
      - name: Scrape
        id: scrape
        continue-on-error: true
        run: |
          python -m src && exit_code=0 || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # The LUMA outage API sits behind an Incapsula WAF that occasionally
      # blocks direct requests even with browser-like headers. When that
      # happens, fall back to loading the real status page in a headless
      # browser and intercepting the same XHR response the page itself makes,
      # which passes the WAF like any other browser visit. This mirrors the
      # approach proven by https://github.com/jpadilla/tracking-luma-outages.
      - name: Run browserless
        if: steps.scrape.outputs.exit_code == '2'
        run: |
          docker run -d \
            --name browserless \
            -p 3000:3000 \
            -e "MAX_CONCURRENT_SESSIONS=1" \
            -e "QUEUE_LENGTH=0" \
            browserless/chrome
          sleep 5

      - name: Capture region snapshot via browserless
        if: steps.scrape.outputs.exit_code == '2'
        run: |
          curl -s --request POST \
            --url http://localhost:3000/function \
            --header 'Content-Type: application/json' \
            --data '{"code": "module.exports=async({page})=>{await page.goto(\"https://miluma.lumapr.com/outages/serviceStatus\");const xhrResponse=await page.waitForResponse(r=>r.request().url().includes(\"/outage/regionsWithoutService\")&&r.request().method()===\"GET\");const xhrPayload=await xhrResponse.json();return{data:xhrPayload,type:\"application/json\"}};"}' \
            --output /tmp/clients_without_service.json
          cat /tmp/clients_without_service.json

      # browserless returns plain error text (e.g. a Puppeteer navigation or
      # waitForResponse timeout) instead of JSON when the capture itself
      # fails, and the step above writes whatever it gets without checking.
      # Left unvalidated, that surfaces two steps later as a confusing
      # Python JSONDecodeError instead of a clear cause - fail fast here.
      - name: Validate browserless capture
        if: steps.scrape.outputs.exit_code == '2'
        run: |
          if ! jq empty /tmp/clients_without_service.json 2>/dev/null; then
            echo "::error::browserless did not return valid JSON - see the 'Capture region snapshot via browserless' step's output above for the actual response (likely a Puppeteer timeout or navigation error)."
            exit 1
          fi

      - name: Scrape using captured snapshot
        if: steps.scrape.outputs.exit_code == '2'
        run: python -m src
        env:
          CLIENTS_WITHOUT_SERVICE_FILE: /tmp/clients_without_service.json

      # Only runs once a snapshot was actually written this run - i.e. the
      # direct scrape succeeded (exit code 0), or the WAF-blocked path (exit
      # code 2) recovered via the browserless fallback above. If the
      # fallback itself failed, that step's own failure already means this
      # one is skipped (its implicit success() check catches that), so no
      # extra condition is needed for that case.
      - name: Recompute reliability metrics
        if: steps.scrape.outputs.exit_code == '0' || steps.scrape.outputs.exit_code == '2'
        run: python -m src.metrics

      - name: Fail job on non-WAF scrape error
        if: steps.scrape.outputs.exit_code != '0' && steps.scrape.outputs.exit_code != '2'
        run: |
          echo "::error::Scrape failed for a reason other than a WAF block (see the Scrape step log above) - not retrying via the browserless fallback."
          exit 1

      - name: Stop browserless
        if: always()
        run: docker rm --force browserless || true
